apiVersion: v1
kind: Secret
metadata:
  name: oauth-server-cert
  labels:
    app: strimzi
type: Opaque
stringData:
  # CA/server certificate used to verify Keycloak HTTPS endpoint.
  #
  # Replace these placeholders with the actual certificate content.
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_KEYCLOAK_CA_CERTIFICATE
    -----END CERTIFICATE-----

  # Only required if Kafka must authenticate to Keycloak using mTLS.
  # If Keycloak only requires normal TLS, this file is not needed.
  kafka-tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_CLIENT_CERTIFICATE
    -----END CERTIFICATE-----

  kafka-tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_CLIENT_PRIVATE_KEY
    -----END PRIVATE KEY-----