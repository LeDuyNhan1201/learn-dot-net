apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alertmanager-tls
  namespace: monitoring

spec:
  secretName: alertmanager-tls
  dnsNames:
    - monitoring-kube-prometheus-alertmanager.monitoring.svc
    - monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local

  issuerRef:
    name: ldnhan-root-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always

  usages:
    - digital signature
    - key encipherment
    - server auth

  duration: 2160h
  renewBefore: 360h