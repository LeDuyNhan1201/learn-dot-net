grafana:
  enabled: true

  adminUser: admin
  adminPassword: admin

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

  service:
    type: ClusterIP


prometheus:
  enabled: true

  prometheusSpec:
    retention: 2d

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi


alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi


kubeStateMetrics:
  enabled: true


nodeExporter:
  enabled: true


defaultRules:
  create: true