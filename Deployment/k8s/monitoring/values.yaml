grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin
  
  grafana.ini:
    server:
      protocol: http
      http_port: 3000
  
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: false
      
      name: Prometheus
      uid: prometheus
      url: https://monitoring-kube-prometheus-prometheus.monitoring:9090/
      timeout: 30
      defaultDatasourceScrapeInterval: 15s
      extraJsonData:
        prometheusType: Prometheus
  
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: https://monitoring-kube-prometheus-prometheus.monitoring.svc:9090/
      access: proxy
      isDefault: true
      jsonData:
        httpMethod: POST
        timeInterval: 30s
        tlsSkipVerify: true

    - name: Alertmanager
      type: alertmanager
      uid: alertmanager
      url: https://monitoring-kube-prometheus-alertmanager.monitoring.svc:9093/
      access: proxy
      jsonData:
        handleGrafanaManagedAlerts: false
        implementation: prometheus
        tlsSkipVerify: true

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.monitoring
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.monitoring

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

  service:
    type: ClusterIP

prometheus:
  enabled: true

  prometheusSpec:
    retention: 2d
    
    additionalScrapeConfigsSecret:
      enabled: true
      name: additional-scrape-configs
      key: prometheus-additional.yaml
    
    web:
      tlsConfig:
        keySecret:
          name: prometheus-tls
          key: tls.key
        cert:
          secret:
            name: prometheus-tls
            key: tls.crt

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

alertmanager:
  enabled: true

  alertmanagerSpec:
    web:
      tlsConfig:
        keySecret:
          name: alertmanager-tls
          key: tls.key
        cert:
          secret:
            name: alertmanager-tls
            key: tls.crt
    
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

defaultRules:
  create: true