apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ldnhan-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: LDNhan Kubernetes Root CA
  subject:
    organizations:
      - Kubernetes Lab
  secretName: ldnhan-root-ca-secret
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io